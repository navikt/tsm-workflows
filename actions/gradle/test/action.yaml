name: "Test with Gradle"

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build with Gradle
      shell: bash
      run: ./gradlew test
