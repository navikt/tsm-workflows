name: "Build with Gradle, build dockerimage and publish to registry"

inputs:
  app:
    required: true
    type: string
  team:
    required: false
    default: "tsm"
    type: string
  GITHUB_TOKEN:
    required: true
    type: string
  salsa:
    description: "Enable image attestation for SLSA, defaults to true"
    required: false
    default: "true"

outputs:
  image:
    description: "Docker image in GAR"
    value: ${{ steps.docker-build-push.outputs.image }}
  digest:
    description: "Docker image digest in GAR"
    value: ${{ steps.docker-build-push.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
    - name: Set up Java 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: gradle
    - name: Setup Gradle
      uses: gradle/actions/setup-gradle@v5
    - name: Build with Gradle
      shell: bash
      run: ./gradlew build
    - name: Build and publish docker image
      uses: nais/docker-build-push@v0
      id: docker-build-push
      with:
        team: ${{ inputs.team }}
        salsa: ${{ inputs.salsa }}
      env:
        ACTIONS_RUNTIME_TOKEN: ${{ inputs.GITHUB_TOKEN  }}
